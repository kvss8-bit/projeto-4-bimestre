version: '3.8'

services:
  backend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm init -y && npm install express && node server.js"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
